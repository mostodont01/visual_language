<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- VL app icon. Export: 256 x 256 PNG to packaging/vl.png. -->
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c52" />
      <stop offset="1" stop-color="#0f1a30" />
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab8ff" />
      <stop offset="1" stop-color="#5f95f5" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#background)" />

  <!-- Wires leading in and out -->
  <g fill="none" stroke="#72a7ff" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <path d="M 0,104 C 24,104 24,148 46,148" />
    <path d="M 210,148 C 232,148 232,192 256,192" />
  </g>

  <!-- Node: body, header bar, outline -->
  <rect x="46" y="62" width="164" height="132" rx="20" fill="#72a7ff" fill-opacity="0.10" />
  <path d="M 46,98 V 82 A 20,20 0 0 1 66,62 H 190 A 20,20 0 0 1 210,82 V 98 Z" fill="url(#header)" />
  <rect x="46" y="62" width="164" height="132" rx="20" fill="none" stroke="#72a7ff" stroke-width="8" />

  <!-- Header dots, like a node title -->
  <rect x="66" y="76" width="44" height="8" rx="4" fill="#14213d" opacity="0.55" />

  <!-- Ports -->
  <circle cx="46" cy="148" r="13" fill="#72a7ff" stroke="#14213d" stroke-width="6" />
  <circle cx="210" cy="148" r="13" fill="#72a7ff" stroke="#14213d" stroke-width="6" />

  <!-- VL -->
  <g fill="none" stroke="#e8eef8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 84,124 L 104,170 L 124,124" />
    <path d="M 142,124 V 170 H 172" />
  </g>
</svg>
